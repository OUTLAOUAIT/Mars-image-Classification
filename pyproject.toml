[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-image-classification"
version = "0.1.0"
description = "Reproducible workflows for classifying HiRISE Mars images"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "Pillow>=9.5"]

[project.optional-dependencies]
train = ["tensorflow>=2.15"]
dev = ["pytest>=7.4", "ruff>=0.4"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "seaborn>=0.13"]

[project.scripts]
mars-classify = "mars_image_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
